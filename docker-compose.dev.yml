version: '3.8'

services:
  # PostgreSQL Database for Development
  postgres:
    image: postgres:15-alpine
    container_name: gardening_app_postgres_dev
    environment:
      POSTGRES_DB: gardening_app_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    networks:
      - gardening_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Development
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: gardening_app_backend_dev
    env_file:
      - .env
    environment:
      # Override specific values for Docker development
      DB_HOST: postgres
      DB_NAME: gardening_app_dev
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gardening_network
    restart: unless-stopped
    command: npm run dev

volumes:
  postgres_dev_data:

networks:
  gardening_network:
    driver: bridge
